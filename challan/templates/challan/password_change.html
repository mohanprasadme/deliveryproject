{% extends "challan/base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="login-card">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <label>Current password {{ form.old_password }}{{ form.old_password.errors }}</label>
    <label>New password {{ form.new_password1 }}{{ form.new_password1.errors }}</label>
    <label>Confirm new password {{ form.new_password2 }}{{ form.new_password2.errors }}</label>
    <button class="btn primary wide" type="submit">Change password</button>
  </form>
</div>
{% endblock %}
